<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ru">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Библиотека'">Библиотека</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Общее меню. sec:authorize показывает элемент только при выполнении условия -->
<nav class="navbar" th:fragment="navbar">
    <span class="brand">📚 Библиотека</span>
    <a th:href="@{/}">Главная</a>
    <a th:href="@{/books}">Книги</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/books/new}">Добавить книгу</a>
    <a th:href="@{/authors}">Авторы</a>

    <span class="spacer"></span>

    <span class="user" sec:authorize="isAuthenticated()">
        👤 <span sec:authentication="name">user</span>
        (<span sec:authorize="hasRole('ADMIN')">администратор</span><span sec:authorize="!hasRole('ADMIN')">пользователь</span>)
    </span>
    <a sec:authorize="!isAuthenticated()" th:href="@{/register}">Регистрация</a>
</nav>

<footer class="footer" th:fragment="footer">
    Учебный проект: Spring MVC + Thymeleaf + Spring Security
</footer>

</body>
</html>
