<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ru">
<head th:replace="~{fragments/layout :: head('Книги')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="page-header">
        <h1>Каталог книг</h1>
        <a class="btn btn-primary" sec:authorize="hasRole('ADMIN')" th:href="@{/books/new}">+ Добавить книгу</a>
    </div>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <form class="search" th:action="@{/books}" method="get">
        <input type="text" name="q" th:value="${q}" placeholder="Поиск по названию или автору">
        <button class="btn" type="submit">Найти</button>
        <a class="btn btn-link" th:if="${!#strings.isEmpty(q)}" th:href="@{/books}">Сбросить</a>
    </form>

    <p class="muted" th:if="${#lists.isEmpty(books)}">Книги не найдены.</p>

    <table th:unless="${#lists.isEmpty(books)}">
        <thead>
        <tr>
            <th>#</th>
            <th>Название</th>
            <th>Автор</th>
            <th>Жанр</th>
            <th>Год</th>
            <th sec:authorize="hasRole('ADMIN')">Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="b : ${books}">
            <td th:text="${b.id}">1</td>
            <td><a th:href="@{/books/{id}(id=${b.id})}" th:text="${b.title}">Название</a></td>
            <td th:text="${b.author}">Автор</td>
            <td th:text="${b.genreName}">Жанр</td>
            <td th:text="${b.year}">2000</td>
            <td class="actions" sec:authorize="hasRole('ADMIN')">
                <a class="btn btn-sm" th:href="@{/books/{id}/edit(id=${b.id})}">Изменить</a>
                <form class="inline" method="post"
                      th:action="@{/books/{id}/delete(id=${b.id})}"
                      onsubmit="return confirm('Удалить эту книгу?');">
                    <button class="btn btn-sm btn-danger" type="submit">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
