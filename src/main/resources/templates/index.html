<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{fragments/layout :: head('Главная')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <h1>Каталог библиотеки</h1>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <p class="muted">Веб-приложение на Spring MVC: Controller &rarr; Service &rarr; Repository.</p>

    <div class="cards">
        <div class="card">
            <div class="card-number" th:text="${bookCount}">0</div>
            <div>книг в каталоге</div>
        </div>
        <div class="card">
            <div class="card-number" th:text="${authorCount}">0</div>
            <div>авторов</div>
        </div>
    </div>

    <p>
        <a class="btn btn-primary" th:href="@{/books}">Открыть каталог</a>
        <a class="btn" th:href="@{/books/new}">Добавить книгу</a>
        <a class="btn" th:href="@{/error-test}">Проверить страницу 500</a>
    </p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
