<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{fragments/layout :: head('Регистрация')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <h1>Регистрация</h1>
    <p class="muted">Новый пользователь получает роль «пользователь»: может просматривать каталог, но не изменять его.</p>

    <form class="form" method="post" novalidate th:object="${registrationForm}" th:action="@{/register}">

        <div class="form-group">
            <label for="username">Логин</label>
            <input type="text" th:field="*{username}" autocomplete="username"
                   th:classappend="${#fields.hasErrors('username')} ? 'invalid'">
            <div class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" th:field="*{password}" autocomplete="new-password"
                   th:classappend="${#fields.hasErrors('password')} ? 'invalid'">
            <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Повторите пароль</label>
            <input type="password" th:field="*{confirmPassword}" autocomplete="new-password"
                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'invalid'">
            <div class="error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
        </div>

        <button class="btn btn-primary" type="submit">Зарегистрироваться</button>
        <a class="btn" th:href="@{/}">Отмена</a>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
