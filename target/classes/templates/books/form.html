<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{fragments/layout :: head('Форма книги')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <!-- Одна форма для создания и редактирования: режим определяется по book.id -->
    <h1 th:text="${book.id == null} ? 'Добавление книги' : 'Редактирование книги'">Книга</h1>

    <form class="form" method="post" novalidate
          th:object="${book}"
          th:action="${book.id == null} ? @{/books} : @{/books/{id}(id=${book.id})}">

        <div class="form-group">
            <label for="title">Название</label>
            <input type="text" th:field="*{title}"
                   th:classappend="${#fields.hasErrors('title')} ? 'invalid'">
            <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>

        <div class="form-group">
            <label for="author">Автор</label>
            <input type="text" th:field="*{author}"
                   th:classappend="${#fields.hasErrors('author')} ? 'invalid'">
            <div class="error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></div>
        </div>

        <div class="form-group">
            <label for="genreId">Жанр</label>
            <select th:field="*{genreId}"
                    th:classappend="${#fields.hasErrors('genreId')} ? 'invalid'">
                <option value="">-- выберите жанр --</option>
                <option th:each="g : ${genres}" th:value="${g.id}" th:text="${g.name}">Жанр</option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('genreId')}" th:errors="*{genreId}"></div>
        </div>

        <div class="form-group">
            <label for="year">Год издания</label>
            <input type="number" th:field="*{year}"
                   th:classappend="${#fields.hasErrors('year')} ? 'invalid'">
            <div class="error" th:if="${#fields.hasErrors('year')}" th:errors="*{year}"></div>
        </div>

        <div class="form-group">
            <label for="description">Описание (необязательно)</label>
            <textarea rows="4" th:field="*{description}"
                      th:classappend="${#fields.hasErrors('description')} ? 'invalid'"></textarea>
            <div class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <button class="btn btn-primary" type="submit">Сохранить</button>
        <a class="btn" th:href="@{/books}">Отмена</a>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
