spring.main.banner-mode=off
spring.thymeleaf.cache=false
server.port=8080

# --- Подключение к MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
# ВАЖНО: впишите пароль root, который вы задали при установке MySQL
spring.datasource.password=5342

# validate: Hibernate НЕ создаёт таблицы, а только проверяет, что они совпадают с сущностями.
# Таблицы создаются нашими SQL-скриптами из папки database/
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
